<!DOCTYPE html>
<html>
<head>
<title>My Course Checklist</title>
<style>
  /* color variables used by the header/sidebar */
  :root {
    --primary-green: #9ACD32;
    --secondary-green: #7ba82a;
  }

  /* overall page look: light grey background */
  body {
    font-family: Arial, sans-serif;
    background-color: #e8e8e8;
    margin: 0; /* header should touch the edges, content gets its own padding below */
  }

  /* wraps everything except the header, so it keeps the old page margin */
  #pageContent {
    margin: 20px;
  }

  /* top header bar with logo, site name, and menu button */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    background-color: white;
    padding: 10px 20px;
    border-bottom: 2px solid var(--primary-green);
  }

  header h1 {
    margin: 0;
    flex: 1; /* pushes the menu button to the right */
    font-size: 1.4rem;
  }

  .logo {
    width: 40px;
    height: 40px;
  }

  /* Menu Button */
  .menu-btn {
    width: 45px;
    height: 45px;

    border: none;
    border-radius: 12px;

    background: var(--primary-green);
    color: white;

    font-size: 1.3rem;
    cursor: pointer;

    transition: 0.2s ease;
  }

  .menu-btn:hover {
    background: var(--secondary-green);
  }

  /* sidebar menu, hidden off-screen until toggled open */
  .sidebar {
    position: fixed;
    top: 0;
    right: -260px; /* starts off screen */
    width: 260px;
    height: 100%;
    background-color: white;
    border-left: 2px solid var(--primary-green);
    padding: 20px;
    transition: right 0.3s ease;
    z-index: 10;
  }

  .sidebar.open {
    right: 0; /* slides into view when open */
  }

  .close-btn {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #2e4d00;
  }

  /* headings use lime green as the accent color */
  h1 {
    color: #4CAF00;
  }

  h2 {
    color: #4CAF00;
    margin-top: 40px;
  }

  h3 {
    margin-bottom: 5px;
  }

  /* each course row (mandatory or elective) */
  .course {
    margin: 5px 0;
    padding: 5px;
    background-color: #f5f5f5;
  }

  .credits {
    color: gray;
    font-size: 14px;
  }

  /* the grey background strip behind the progress bar */
  #progressBarOutside {
    width: 100%;
    background-color: #d3d3d3;
    border: 1px solid gray;
    height: 25px;
  }

  /* the lime green fill that grows as credits get checked off */
  #progressBarInside {
    height: 100%;
    background-color: #9ACD32;
    width: 0%;
    text-align: center;
    color: #2e4d00;
    font-weight: bold;
  }

  button {
    padding: 5px 10px;
    margin: 3px;
    background-color: #f5f5f5;
    border: 1px solid gray;
  }

  /* highlights whichever career goal button is currently picked */
  .selectedButton {
    background-color: #9ACD32;
    color: #2e4d00;
    border: 1px solid #7ba82a;
  }

  /* lime green border around electives that match the chosen career goal */
  .recommended {
    border: 2px solid #9ACD32;
  }
</style>
</head>

    alt="KUAS Logo">
  <h1>KUAS ナビ</h1>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<!-- sidebar menu, slides in from the right when the ☰ button is clicked -->
<div id="sidebar" class="sidebar">
  <button class="close-btn" onclick="toggleMenu()">✕</button>
</div>

<div id="pageContent">
<h2>My Course Checklist</h2>
<p>Check off the mandatory classes you have finished. Then pick a career goal to see elective suggestions.</p>

<!-- credit progress bar, filled in by updateProgressBar() -->
<h2>Progress: <span id="creditsDone">0</span> / <span id="creditsTotal">0</span> credits</h2>
<div id="progressBarOutside">
  <div id="progressBarInside">0%</div>
</div>

<!-- mandatory course checklist, filled in by drawCourseList() -->
<h2>Mandatory Courses</h2>
<div id="courseListDiv"></div>

<!-- career goal buttons, filled in by drawGoalButtons() -->
<h2>Pick Your Career Goal</h2>
<div id="goalButtonsDiv"></div>

<!-- elective suggestions, filled in by drawElectiveList() -->
<h2>Suggested Electives</h2>
<div id="electiveListDiv"></div>

<!-- submit button, runs submitForm() to show a summary -->
<br>
<button onclick="submitForm()">Submit</button>
<div id="submitMessage"></div>

</div> <!-- closes #pageContent -->

<script>

// opens or closes the sidebar by adding/removing the "open" class
function toggleMenu() {
  var sidebar = document.getElementById("sidebar");
  sidebar.classList.toggle("open");
}

// list of mandatory courses
var mandatoryCourses = [
  { id: 1, code: "JPN 101", name: "Japanese", credits: 2, group: "Core Requirements", done: false },
  { id: 2, code: "MATH 210", name: "Calculus", credits: 4, group: "Core Requirements", done: false },
  { id: 3, code: "MATH 220", name: "Linear Algebra", credits: 3, group: "Core Requirements", done: false },
  { id: 4, code: "ME 230", name: "Fundamental Mechanics", credits: 3, group: "Core Requirements", done: false },
  { id: 5, code: "CS 110", name: "Introduction to Python", credits: 3, group: "Core Requirements", done: false },
  { id: 6, code: "PHYS 240", name: "Engineering Physics", credits: 4, group: "Core Requirements", done: false },
  { id: 7, code: "PE 300", name: "Sports Practical (Choose an Event)", credits: 2, group: "Physical Education", done: false, hasDropdown: true },
  { id: 8, code: "CAP 490", name: "Senior Capstone Project", credits: 5, group: "Capstone", done: false }
];

// choices for the sports practical dropdown
var sportOptions = ["Table Tennis", "Basketball", "New Sports", "Softball", "Fitness", "Fitness Training"];
var selectedSport = ""; // stores whichever sport the student picks from the dropdown

// runs when the dropdown value changes, saves the choice into selectedSport
function setSport(sport) {
  selectedSport = sport;
}

// list of career goals for the buttons (engineering disciplines only)
var careerGoals = ["mechanical", "electrical", "civil", "computer", "chemical"];

// list of elective courses, each has tags for which goals they match
var electiveCourses = [
  { code: "ME 210", name: "Statics and Dynamics", credits: 4, tags: ["mechanical", "civil"], why: "Core to understanding forces on structures and machines." },
  { code: "ME 320", name: "Thermodynamics", credits: 4, tags: ["mechanical", "chemical"], why: "Needed for engines, HVAC, and energy systems." },
  { code: "ME 350", name: "Machine Design", credits: 3, tags: ["mechanical"], why: "Teaches how to design real mechanical parts." },
  { code: "EE 210", name: "Circuit Analysis", credits: 4, tags: ["electrical", "computer"], why: "The foundation for anything with circuits." },
  { code: "EE 330", name: "Signals and Systems", credits: 3, tags: ["electrical"], why: "Used in communications, audio, and controls." },
  { code: "EE 340", name: "Electromagnetics", credits: 3, tags: ["electrical"], why: "Explains how antennas, motors, and sensors work." },
  { code: "CE 220", name: "Structural Analysis", credits: 4, tags: ["civil"], why: "Needed to design buildings and bridges safely." },
  { code: "CE 250", name: "Fluid Mechanics", credits: 3, tags: ["civil", "mechanical"], why: "Used in water systems, HVAC, and hydraulics." },
  { code: "CE 310", name: "Geotechnical Engineering", credits: 3, tags: ["civil"], why: "Covers how soil and foundations behave." },
  { code: "CS 215", name: "Data Structures and Algorithms", credits: 4, tags: ["computer"], why: "Needed for almost every software engineering job." },
  { code: "CS 330", name: "Computer Architecture", credits: 3, tags: ["computer", "electrical"], why: "Connects hardware and software together." },
  { code: "CS 355", name: "Embedded Systems", credits: 3, tags: ["computer", "electrical"], why: "Useful for robotics and hardware projects." },
  { code: "CHE 210", name: "Chemical Process Principles", credits: 4, tags: ["chemical"], why: "The starting point for most chemical engineering work." },
  { code: "CHE 310", name: "Reaction Engineering", credits: 3, tags: ["chemical"], why: "Explains how chemical reactions are scaled up safely." },
  { code: "CHE 330", name: "Heat and Mass Transfer", credits: 3, tags: ["chemical", "mechanical"], why: "Common ground between chemical and mechanical engineering." }
];

var currentGoal = "undecided"; // which career goal button is currently selected

// adds up the credits for every mandatory course (whether done or not)
function calculateTotalCredits() {
  var total = 0;
  for (var i = 0; i < mandatoryCourses.length; i++) {
    total = total + mandatoryCourses[i].credits;
  }
  return total;
}

// adds up the credits only for mandatory courses that are checked off
function calculateDoneCredits() {
  var done = 0;
  for (var i = 0; i < mandatoryCourses.length; i++) {
    if (mandatoryCourses[i].done) {
      done = done + mandatoryCourses[i].credits;
    }
  }
  return done;
}

// updates the numbers and the green bar at the top of the page
function updateProgressBar() {
  var total = calculateTotalCredits();
  var done = calculateDoneCredits();
  var percent = Math.round((done / total) * 100);

  document.getElementById("creditsDone").innerHTML = done;
  document.getElementById("creditsTotal").innerHTML = total;
  document.getElementById("progressBarInside").style.width = percent + "%";
  document.getElementById("progressBarInside").innerHTML = percent + "%";
}

// flips a course between done and not done when its checkbox is clicked
function toggleCourse(courseId) {
  for (var i = 0; i < mandatoryCourses.length; i++) {
    if (mandatoryCourses[i].id === courseId) {
      mandatoryCourses[i].done = !mandatoryCourses[i].done;
    }
  }
  drawCourseList(); // redraw so the checkbox and strikethrough update
  updateProgressBar(); // recalculate the credit total
}

// builds the mandatory course checklist, grouped by category (Core Requirements, etc.)
function drawCourseList() {
  var listDiv = document.getElementById("courseListDiv");
  listDiv.innerHTML = "";

  // group courses by their group name
  var groupNames = [];
  for (var i = 0; i < mandatoryCourses.length; i++) {
    if (groupNames.indexOf(mandatoryCourses[i].group) === -1) {
      groupNames.push(mandatoryCourses[i].group);
    }
  }

  for (var g = 0; g < groupNames.length; g++) {
    var groupName = groupNames[g];
    var heading = document.createElement("h3");
    heading.innerHTML = groupName; // e.g. "Core Requirements"
    listDiv.appendChild(heading);

    // loop through every course again, only show the ones in this group
    for (var i = 0; i < mandatoryCourses.length; i++) {
      var course = mandatoryCourses[i];
      if (course.group === groupName) {
        var div = document.createElement("div");
        div.className = "course";

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = course.done;
        checkbox.onclick = (function(id) {
          return function() { toggleCourse(id); };
        })(course.id); // remembers which course this checkbox belongs to

        div.appendChild(checkbox);

        // build the label as its own element instead of using innerHTML +=
        // (innerHTML += rebuilds the whole div from text, which would destroy
        // the checkbox above and its onclick handler)
        var label = document.createElement("span");
        label.innerHTML = " " + course.name +
          " <span class='credits'>(" + course.credits + " credits)</span>";
        div.appendChild(label);

        // if this course has a dropdown, add it (used for the sports practical course)
        if (course.hasDropdown) {
          var selectBox = document.createElement("select");

          var blankOption = document.createElement("option");
          blankOption.value = "";
          blankOption.innerHTML = "-- choose a sport --";
          selectBox.appendChild(blankOption);

          for (var s = 0; s < sportOptions.length; s++) {
            var option = document.createElement("option");
            option.value = sportOptions[s];
            option.innerHTML = sportOptions[s];
            if (sportOptions[s] === selectedSport) {
              option.selected = true;
            }
            selectBox.appendChild(option);
          }

          selectBox.onchange = function() {
            setSport(this.value);
          };

          div.appendChild(selectBox);
        }

        listDiv.appendChild(div);
      }
    }
  }
}

// runs when a career goal button is clicked
function setGoal(goal) {
  currentGoal = goal;
  drawGoalButtons(); // redraw so the clicked button turns lime green
  drawElectiveList(); // redraw so matching electives move to the top
}

// draws the row of career goal buttons (mechanical, electrical, etc.)
function drawGoalButtons() {
  var buttonsDiv = document.getElementById("goalButtonsDiv");
  buttonsDiv.innerHTML = "";

  for (var i = 0; i < careerGoals.length; i++) {
    var goal = careerGoals[i];
    var button = document.createElement("button");
    button.innerHTML = goal;
    if (goal === currentGoal) {
      button.className = "selectedButton"; // highlight the active goal
    }
    button.onclick = (function(g) {
      return function() { setGoal(g); };
    })(goal);
    buttonsDiv.appendChild(button);
  }
}

// draws the elective list, with courses matching the chosen goal shown first
function drawElectiveList() {
  var listDiv = document.getElementById("electiveListDiv");
  listDiv.innerHTML = "";

  // split electives into two groups: matches the goal, and everything else
  var matching = [];
  var notMatching = [];

  for (var i = 0; i < electiveCourses.length; i++) {
    var course = electiveCourses[i];
    if (course.tags.indexOf(currentGoal) !== -1) {
      matching.push(course);
    } else {
      notMatching.push(course);
    }
  }

  // put the matching electives on top, then the rest
  var sortedList = matching.concat(notMatching);

  for (var i = 0; i < sortedList.length; i++) {
    var course = sortedList[i];
    var div = document.createElement("div");
    div.className = "course";
    if (course.tags.indexOf(currentGoal) !== -1) {
      div.className += " recommended"; // adds the lime green border
    }

    var recommendedText = "";
    if (course.tags.indexOf(currentGoal) !== -1) {
      recommendedText = " <b>(recommended for you)</b>";
    }

    div.innerHTML = course.name +
      " <span class='credits'>(" + course.credits + " credits)</span>" +
      recommendedText + "<br>123"; // 123 is placeholder text, swap in real descriptions later

    listDiv.appendChild(div);
  }
}

// runs when the Submit button is clicked, shows a short summary of everything picked
function submitForm() {
  var done = calculateDoneCredits();
  var total = calculateTotalCredits();
  var message = "You have completed " + done + " out of " + total + " mandatory credits.";

  if (selectedSport !== "") {
    message = message + " Sport chosen: " + selectedSport + ".";
  } else {
    message = message + " No sport chosen yet.";
  }

  message = message + " Career goal: " + currentGoal + ".";

  document.getElementById("submitMessage").innerHTML = message;
}

// run everything when the page loads
drawCourseList();
updateProgressBar();
drawGoalButtons();
drawElectiveList();

</script>

</body>
</html>
